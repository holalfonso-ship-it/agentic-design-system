name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Índice de componentes sincronizado
        # index.toon se genera desde la metadata; un índice desactualizado
        # genera falsos negativos para los agentes (ver CLAUDE.md, paso 4).
        # Se ignora la línea de cabecera, que lleva la fecha de generación.
        run: |
          npm run generate-index
          git diff --exit-code -I '^# index.toon' -- index.toon

      - name: Lint
        run: npm run lint

      - name: Tipos y build
        run: npm run build

      - name: Tests
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=lcov

      - name: Build de Storybook
        run: npm run build-storybook

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
